<html lang="zh" class="light">

    <title>Preflight</title>
    <style id="theme-vars">
/* ============================================================
   AI Lesson Recorder — Teacher Review Workspace
   Design Direction: Warm, Friendly Education (教育温暖亲和风)
   Brand Prefix: lr
   ============================================================ */

/* ---------- Color Tokens (Warm Education Palette) ---------- */
:root {
  /* Brand surfaces — warm cream / ivory */
  --lr-background: #FBF6EC;          /* warm ivory page */
  --lr-foreground: #3A3225;          /* warm ink brown */

  --lr-card: #FFFFFF;               /* clean card */
  --lr-card-foreground: #3A3225;

  --lr-popover: #FFFFFF;
  --lr-popover-foreground: #3A3225;

  /* Primary — warm sage green (growth + education, friendly) */
  --lr-primary: #5B9279;
  --lr-primary-foreground: #FFFFFF;
  --lr-primary-soft: #E6F0E9;       /* tinted surface for active/chips */
  --lr-primary-press: #4D7E68;

  /* Muted / neutral — warm taupe */
  --lr-muted: #F2E9D8;              /* warm beige panel */
  --lr-muted-foreground: #8A7C66;    /* warm taupe gray text */

  /* Border — warm light beige */
  --lr-border: #E8DCC6;
  --lr-input: #E8DCC6;
  --lr-ring: #5B9279;

  /* Warm accent — peach (highlights, illustrations) */
  --lr-accent: #E8A87C;
  --lr-accent-soft: #FBE9DB;

  /* Semantic — warm-tuned, not clinical */
  --lr-warning: #E0A33E;            /* warm amber */
  --lr-warning-soft: #FBEFD6;
  --lr-danger: #E07856;              /* warm coral (risk) */
  --lr-danger-soft: #FAE2D8;
  --lr-success: #5B9279;
  --lr-success-soft: #E6F0E9;
  --lr-info: #6FA3B5;                /* muted warm teal-blue, used sparingly */
  --lr-info-soft: #E2EEF1;

  /* Radius scale — friendly, rounded */
  --lr-radius-sm: 10px;
  --lr-radius-md: 14px;
  --lr-radius-lg: 20px;
  --lr-radius-xl: 28px;

  /* Shadows — soft, warm-tinted */
  --lr-shadow-xs: 0 1px 2px rgba(58, 50, 37, 0.05);
  --lr-shadow-sm: 0 2px 8px rgba(58, 50, 37, 0.06);
  --lr-shadow-md: 0 6px 20px rgba(58, 50, 37, 0.08);
  --lr-shadow-lg: 0 14px 38px rgba(58, 50, 37, 0.10);

  /* Typography */
  --lr-font-sans: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --lr-font-display: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --lr-font-mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, monospace;
}

/* ---------- Tailwind theme inline mapping ---------- */
@theme inline {
  --color-background: var(--lr-background);
  --color-foreground: var(--lr-foreground);
  --color-card: var(--lr-card);
  --color-card-foreground: var(--lr-card-foreground);
  --color-popover: var(--lr-popover);
  --color-popover-foreground: var(--lr-popover-foreground);
  --color-primary: var(--lr-primary);
  --color-primary-foreground: var(--lr-primary-foreground);
  --color-muted: var(--lr-muted);
  --color-muted-foreground: var(--lr-muted-foreground);
  --color-border: var(--lr-border);
  --color-input: var(--lr-input);
  --color-ring: var(--lr-ring);
  --color-accent: var(--lr-accent);
  --color-warning: var(--lr-warning);
  --color-danger: var(--lr-danger);
  --color-success: var(--lr-success);
  --color-info: var(--lr-info);

  --font-sans: var(--lr-font-sans);
  --font-display: var(--lr-font-display);
  --font-mono: var(--lr-font-mono);

  --radius-sm: var(--lr-radius-sm);
  --radius-md: var(--lr-radius-md);
  --radius-lg: var(--lr-radius-lg);
  --radius-xl: var(--lr-radius-xl);
}

/* ---------- Semantic aliases for fill-html-head.mjs ---------- */
:root {
  --background: var(--lr-background);
  --foreground: var(--lr-foreground);
  --card: var(--lr-card);
  --card-foreground: var(--lr-card-foreground);
  --popover: var(--lr-popover);
  --popover-foreground: var(--lr-popover-foreground);
  --primary: var(--lr-primary);
  --primary-foreground: var(--lr-primary-foreground);
  --muted: var(--lr-muted);
  --muted-foreground: var(--lr-muted-foreground);
  --border: var(--lr-border);
  --input: var(--lr-input);
  --ring: var(--lr-ring);
  --radius-sm: var(--lr-radius-sm);
  --radius-md: var(--lr-radius-md);
  --radius-lg: var(--lr-radius-lg);
  --radius-xl: var(--lr-radius-xl);
}

/* ---------- Base ---------- */
html { font-family: var(--lr-font-sans); }
body {
  background: var(--lr-background);
  color: var(--lr-foreground);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
